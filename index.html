<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #f8f9fa;
        color: #6b7280;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .splash-title {
        font-size: 16px;
        font-weight: 600;
        color: #374151;
      }
      .splash-subtitle {
        font-size: 12px;
        color: #9ca3af;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #e5e7eb;
        border-top-color: #3b82f6;
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        body,
        #app-splash {
          background: #0f1117;
          color: #9ca3af;
        }
        .splash-title {
          color: #e5e7eb;
        }
        .splash-spinner {
          border-color: #1f2937;
          border-top-color: #60a5fa;
        }
      }
    </style>
  </head>

  <body>
    <div id="app-splash">
      <div class="splash-card">
        <div class="splash-spinner"></div>
        <div class="splash-title">Folder Insight</div>
        <div class="splash-subtitle">Loading...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
